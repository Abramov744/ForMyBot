name: Telegram Bot Poll

on:
#  schedule:
#    - cron: "*/5 * * * *"
  workflow_dispatch:

jobs:
  poll:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - run: pip install -r requirements.txt

      - name: Poll Telegram for /report commands
        env:
          ASTER_USER_ADDRESS: ${{ secrets.ASTER_USER_ADDRESS }}
          ASTER_SIGNER_ADDRESS: ${{ secrets.ASTER_SIGNER_ADDRESS }}
          ASTER_SIGNER_PRIVATE_KEY: ${{ secrets.ASTER_SIGNER_PRIVATE_KEY }}
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
          BYBIT_API_KEY: ${{ secrets.BYBIT_API_KEY }}
          BYBIT_API_SECRET: ${{ secrets.BYBIT_API_SECRET }}
          BYBIT_PROXY: ${{ secrets.BYBIT_PROXY }}
          LIGHTER_ACCOUNT_INDEX: ${{ secrets.LIGHTER_ACCOUNT_INDEX }}
          LIGHTER_AUTH_TOKEN: ${{ secrets.LIGHTER_AUTH_TOKEN }}
          MEXC_API_KEY: ${{ secrets.MEXC_API_KEY }}
          MEXC_API_SECRET: ${{ secrets.MEXC_API_SECRET }}
          GATE_API_KEY: ${{ secrets.GATE_API_KEY }}
          GATE_API_SECRET: ${{ secrets.GATE_API_SECRET }}
        run: python bot_poll.py
